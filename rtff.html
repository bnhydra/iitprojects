<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RTFF &amp; RTDAS | Flood Forecasting</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"/>
<link rel="stylesheet" href="css/style.css"/>
<style>
  .page-section{background:#f8f9fa}
  .page-section .section-title{color:var(--maroon)}
</style>
</head>
<body>
<div id="nav-placeholder"></div>

<main class="page-section pt-5">
  <div class="container" id="content" style="padding-top:4rem;padding-bottom:4rem"></div>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { NAV_HTML, FOOTER_HTML, initNav, lazyLoad, revealAll, img } from './js/shared.js';
document.getElementById('nav-placeholder').innerHTML = NAV_HTML;
document.getElementById('footer-placeholder').innerHTML = FOOTER_HTML;
initNav();

const d = await fetch('data/rtff.json').then(r => r.json());
const el = document.getElementById('content');
el.innerHTML = `
  <h2 class="section-title reveal">${d.title}</h2>
  <div class="row align-items-center g-4 mb-4">
    <div class="col-lg-6 reveal">
      <p class="mb-3">${d.intro}</p>
      <ul class="mb-3" style="line-height:1.9">${d.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
      <p class="text-muted" style="font-size:.9rem">${d.note}</p>
    </div>
    <div class="col-lg-6 reveal">${img(d.diagramImage, 'RTFF Diagram', 'rtff-diagram')}</div>
  </div>
  <div class="row g-3">
    ${d.features.map(f => `
    <div class="col-md-4 reveal">
      <div class="feature-card">
        <div class="fc-icon">${f.icon}</div>
        <h5>${f.title}</h5>
        <p>${f.desc}</p>
      </div>
    </div>`).join('')}
  </div>`;
lazyLoad(el);
revealAll(el);
</script>
</body>
</html>
