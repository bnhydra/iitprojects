<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>People | Prof. Balaji Narasimhan</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<script type="module">
import { initNav, revealOnScroll, showLoader, hideLoader } from './js/shared.js';
initNav();
showLoader();
try {
const d = await fetch('data/people.json').then(r=>r.json());

document.getElementById('header').innerHTML = `
<div class="container">
  <p class="breadcrumb"><a href="index.html">Home</a> › ${d.title}</p>
  <h1>${d.title}</h1>
  <p>${d.subtitle}</p>
</div>`;

const FALLBACK = 'images/people/Default.jpg';
const FALLBACK_ESC = FALLBACK;
const personCard = (p) => {
  const src = p.photo || FALLBACK;
  const pData = encodeURIComponent(JSON.stringify({name:p.name,role:p.role,photo:p.photo||''}));
  const clickable = p.profile ? `data-profile="${p.profile}" data-person="${pData}" style="cursor:pointer"` : '';
  return `
<div class="person-card reveal" ${clickable}>
  <img src="${src}" alt="${p.name}" class="person-photo" onerror="this.onerror=null;this.src='${FALLBACK_ESC}'"/>
  <h4>${p.name}</h4>
  <p class="person-role">${p.role || ''}</p>
  <p>${p.title || ''}</p>
  ${p.tag ? `<span class="tag">${p.tag}</span>` : ''}
  ${p.profile ? '<span class="profile-hint">View Profile ›</span>' : ''}
</div>`;
};

document.getElementById('content').innerHTML = `
<div class="container section">
  ${d.sections.map(s => `
  <h2 class="section-title reveal">${s.heading}</h2>
  <div class="people-grid" style="margin-bottom:2.5rem">
    ${s.people.map(p => personCard(p)).join('')}
  </div>`).join('')}
</div>`;

revealOnScroll();

// Modal logic
document.getElementById('content').addEventListener('click', async e => {
  const card = e.target.closest('[data-profile]');
  if (!card) return;
  const modal = document.getElementById('profile-modal');
  const body  = document.getElementById('modal-body');
  body.innerHTML = '<p style="color:var(--muted)">Loading…</p>';
  modal.classList.add('open');
  const person = JSON.parse(decodeURIComponent(card.dataset.person));
  try {
    const pd = await fetch(`data/People/${card.dataset.profile}`).then(r => { if(!r.ok) throw new Error(); return r.json(); });
    body.innerHTML = renderProfile(person, pd, FALLBACK_ESC);
  } catch {
    body.innerHTML = '<p style="color:var(--muted)">Profile data unavailable.</p>';
  }
});

document.getElementById('profile-modal').addEventListener('click', e => { if(e.target === e.currentTarget) e.currentTarget.classList.remove('open'); });

function renderProfile(person, pd, fallback) {
  const avatarSrc = person.photo || fallback;
  const avatar = `<img src="${avatarSrc}" alt="${person.name}" class="pm-avatar" onerror="this.onerror=null;this.src='${fallback}'"/>`;
  const FIG_FALLBACK = 'images/PeopleProject/Default.jpg';
  const fig = pd.figure
    ? `<img src="${pd.figure}" alt="${pd.figureCaption||'Research figure'}" class="pm-figure-img" onerror="this.onerror=null;this.src='${FIG_FALLBACK}'"/>`
    : `<img src="${FIG_FALLBACK}" alt="Research figure" class="pm-figure-img"/>`;
  return `
<div class="pm-header">
  <div class="pm-header-left">
    ${avatar}
    <div>
      <div class="pm-name">${person.name}</div>
      <div class="pm-role">${person.role||''}</div>
    </div>
  </div>
  <button class="pm-close" onclick="document.getElementById('profile-modal').classList.remove('open')" aria-label="Close">&times;</button>
</div>
<div class="pm-body">
  <div class="pm-left">
    ${pd.researchArea ? `<div class="pm-pill"><span class="pm-pill-label">Research Area:</span> ${pd.researchArea}</div>` : ''}
    <div class="pm-section-label">RESEARCH SUMMARY</div>
    <p class="pm-summary">${pd.summary||''}</p>
  </div>
  <div class="pm-right">
    <div class="pm-figure-block">
      ${fig}
      ${pd.figureCaption ? `<p class="pm-figure-caption">${pd.figureCaption}</p>` : ''}
    </div>
  </div>
</div>`;
}

} catch(e) {
  document.getElementById('content').innerHTML = '<div class="container section" style="color:var(--muted)">Failed to load content. Please try again.</div>';
} finally {
  hideLoader();
}
</script>
<div id="header" class="page-header"></div>
<main id="content"></main>

<div id="profile-modal" class="modal-overlay">
  <div class="modal-box">
    <div id="modal-body"></div>
  </div>
</div>
</body>
</html>
