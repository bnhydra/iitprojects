<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>People | Prof. Balaji Narasimhan</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<script type="module">
import { initNav, revealOnScroll, showLoader, hideLoader } from './js/shared.js';
initNav();
showLoader();
try {
const d = await fetch('data/people.json').then(r=>r.json());

document.getElementById('header').innerHTML = `
<div class="container">
  <p class="breadcrumb"><a href="index.html">Home</a> › ${d.title}</p>
  <h1>${d.title}</h1>
  <p>${d.subtitle}</p>
</div>`;

const FALLBACK = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' fill='%231C7293'/%3E%3Ccircle cx='40' cy='30' r='16' fill='rgba(255,255,255,.7)'/%3E%3Cellipse cx='40' cy='72' rx='24' ry='18' fill='rgba(255,255,255,.7)'/%3E%3C/svg%3E`;

const FALLBACK_ESC = FALLBACK.replace(/'/g, '&apos;');
const personCard = (p) => {
  const src = p.photo || FALLBACK;
  return `
<div class="person-card reveal">
  <img src="${src}" alt="${p.name}" class="person-photo" onerror="this.onerror=null;this.src='${FALLBACK_ESC}'"/>
  <h4>${p.name}</h4>
  <p class="person-role">${p.role || ''}</p>
  <p>${p.title || ''}</p>
  ${p.tag ? `<span class="tag">${p.tag}</span>` : ''}
</div>`;
};

document.getElementById('content').innerHTML = `
<div class="container section">
  ${d.sections.map(s => `
  <h2 class="section-title reveal">${s.heading}</h2>
  <div class="people-grid" style="margin-bottom:2.5rem">
    ${s.people.map(p => personCard(p)).join('')}
  </div>`).join('')}
</div>`;

revealOnScroll();
} catch(e) {
  document.getElementById('content').innerHTML = '<div class="container section" style="color:var(--muted)">Failed to load content. Please try again.</div>';
} finally {
  hideLoader();
}
</script>
<div id="header" class="page-header"></div>
<main id="content"></main>
</body>
</html>
