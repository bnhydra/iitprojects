<body>
<script type="module">
import { initNav, revealOnScroll, showLoader, hideLoader } from './js/shared.js';
initNav();
showLoader();
try {
const d = await fetch('data/consultancy.json').then(r=>r.json());

document.getElementById('header').innerHTML = `
<div class="container">
  <p class="breadcrumb"><a href="index.html">Home</a> › ${d.title}</p>
  <h1>${d.title}</h1>
  <p>${d.subtitle}</p>
</div>`;

document.getElementById('content').innerHTML = `
<div class="container section">
  <div class="cards">
    ${d.services.map(s=>`
    <div class="card reveal">
      <div class="card-num">${s.num}</div>
      <h3>${s.title}</h3>
      <p>${s.desc}</p>
    </div>`).join('')}
  </div>
  <div class="clients-banner reveal">
    <div class="label">${d.clientsLabel}</div>
    <p>${d.clients}</p>
  </div>
</div>`;

revealOnScroll();
} catch(e) {
  document.getElementById('content').innerHTML = '<div class="container section" style="color:var(--muted)">Failed to load content. Please try again.</div>';
} finally {
  hideLoader();
}
</script>
