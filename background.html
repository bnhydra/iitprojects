<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Background | Flood Forecasting</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"/>
<link rel="stylesheet" href="css/style.css"/>
<style>
  .page-section{background:#0d1b2a;color:#fff}
  .page-section .section-title{color:#fff}
</style>
</head>
<body>
<div id="nav-placeholder"></div>

<main class="page-section pt-5">
  <div class="container" id="content" style="padding-top:4rem"></div>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { NAV_HTML, FOOTER_HTML, initNav, lazyLoad, revealAll, img } from './js/shared.js';
document.getElementById('nav-placeholder').innerHTML = NAV_HTML;
document.getElementById('footer-placeholder').innerHTML = FOOTER_HTML;
initNav();

const d = await fetch('data/background.json').then(r => r.json());
const el = document.getElementById('content');
el.innerHTML = `
  <h2 class="section-title reveal">${d.title}</h2>
  <div class="stat-banner reveal">${d.statBanner}</div>
  <div class="flood-timeline reveal">
    ${d.timeline.map(t => `<div class="timeline-item"><div class="year">${t.year}</div><div class="event">${t.event}</div></div>`).join('')}
  </div>
  <div class="row g-3 pb-5">
    ${d.floodCards.map(c => `
    <div class="col-md-4 reveal">
      <div class="flood-card">
        ${img(c.image, c.label)}
        <div class="flood-label"><span class="badge-year">${c.year}</span>${c.label}</div>
      </div>
    </div>`).join('')}
  </div>`;
lazyLoad(el);
revealAll(el);
</script>
</body>
</html>
