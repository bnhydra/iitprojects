<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Climate | Flood Forecasting</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"/>
<link rel="stylesheet" href="css/style.css"/>
<style>
  .page-section{background:#fff}
  .page-section .section-title{color:#0070C0}
</style>
</head>
<body>
<div id="nav-placeholder"></div>

<main class="page-section pt-5">
  <div class="container" id="content" style="padding-top:4rem;padding-bottom:4rem"></div>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { NAV_HTML, FOOTER_HTML, initNav, lazyLoad, revealAll, img } from './js/shared.js';
document.getElementById('nav-placeholder').innerHTML = NAV_HTML;
document.getElementById('footer-placeholder').innerHTML = FOOTER_HTML;
initNav();

const d = await fetch('data/climate.json').then(r => r.json());
const el = document.getElementById('content');
el.innerHTML = `
  <h2 class="section-title reveal">${d.title}</h2>
  <div class="row align-items-start g-4">
    <div class="col-lg-6 reveal">
      <p class="climate-title-text">${d.description}</p>
      <p class="mb-2"><strong>${d.teamLabel}</strong></p>
      <div class="mb-3">${d.team.map(m => `<span class="team-chip">${m}</span>`).join('')}</div>
    </div>
    <div class="col-lg-6 reveal">
      <div class="row g-3">
        ${d.images.map(i => `<div class="col-6">${img(i.src, i.alt, 'climate-img')}</div>`).join('')}
      </div>
    </div>
  </div>`;
lazyLoad(el);
revealAll(el);
</script>
</body>
</html>
