<!-- Structured Data -->
<script type="application/ld+json">
[
  {
    "@context": "https://schema.org",
    "@type": "JobPosting",
    "title": "PhD Research Scholar – Flood Forecasting / Digital Twin / SuDS",
    "description": "M.Tech/M.E. in Civil/Water Resources/Environmental Engineering. Strong background in hydrology and programming.",
    "hiringOrganization": { "@type": "CollegeOrUniversity", "name": "Indian Institute of Technology Madras", "sameAs": "https://www.iitm.ac.in/" },
    "jobLocation": { "@type": "Place", "address": { "@type": "PostalAddress", "addressLocality": "Chennai", "postalCode": "600036", "addressCountry": "IN" } },
    "employmentType": "FULL_TIME"
  },
  {
    "@context": "https://schema.org",
    "@type": "JobPosting",
    "title": "Post-Doctoral Fellow – Climate Change & Water Resources",
    "description": "PhD in Hydrology/Water Resources/Civil Engineering. Publications in peer-reviewed journals. Experience with climate models and SWAT.",
    "hiringOrganization": { "@type": "CollegeOrUniversity", "name": "Indian Institute of Technology Madras", "sameAs": "https://www.iitm.ac.in/" },
    "jobLocation": { "@type": "Place", "address": { "@type": "PostalAddress", "addressLocality": "Chennai", "postalCode": "600036", "addressCountry": "IN" } },
    "employmentType": "FULL_TIME"
  }
]
</script>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<script type="module">
import { initNav, revealOnScroll, showLoader, hideLoader } from './js/shared.js';
initNav();
showLoader();
try {
const d = await fetch('data/joinus.json').then(r=>r.json());

document.getElementById('header').innerHTML = `
<div class="container">
  <p class="breadcrumb"><a href="index.html">Home</a> › ${d.title}</p>
  <h1>${d.title}</h1>
  <p>${d.subtitle}</p>
</div>`;

document.getElementById('content').innerHTML = `
<div class="container section">
  ${d.openings.map(o=>`
  <div class="join-box reveal">
    <h3>${o.role}</h3>
    <p><strong style="color:rgba(255,255,255,.9)">Area:</strong> ${o.area}</p>
    <p class="req"><strong>Requirements:</strong> ${o.requirements}</p>
    <a href="${o.apply}" class="btn-apply">Apply Now →</a>
  </div>`).join('')}
  <div class="clients-banner reveal">
    <div class="label">${d.contact.label}</div>
    <p><a href="mailto:${d.contact.email}" style="color:var(--gold)">${d.contact.email}</a></p>
    <p style="margin-top:.4rem;font-size:.82rem;color:rgba(255,255,255,.55)">${d.contact.address}</p>
  </div>
  ${d.location ? `
  <div class="location-box reveal">
    <h2 class="section-title">Contact</h2>
    <p>${d.location.room}</p>
    <p>${d.location.division}</p>
    <p>${d.location.institute}</p>
    <a href="${d.location.mapLink}" target="_blank" rel="noopener" class="map-link">
      🗺️ View on Map
    </a>
  </div>` : ''}
</div>`;

revealOnScroll();
} catch(e) {
  document.getElementById('content').innerHTML = '<div class="container section" style="color:var(--muted)">Failed to load content. Please try again.</div>';
} finally {
  hideLoader();
}
</script>
<div id="header" class="page-header"></div>
<main id="content"></main>
</body>
</html>
