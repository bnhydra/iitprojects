<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Academic Teaching | Prof. Balaji Narasimhan</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<script type="module">
import { initNav, revealOnScroll } from './js/shared.js';
initNav();
const d = await fetch('data/teaching.json').then(r=>r.json());

document.getElementById('header').innerHTML = `
<div class="container">
  <p class="breadcrumb"><a href="index.html">Home</a> › ${d.title}</p>
  <h1>${d.title}</h1>
  <p>${d.subtitle}</p>
</div>`;

document.getElementById('content').innerHTML = `
<div class="container section">
  <div class="two-col reveal">
    <div class="list-box">
      <div class="list-box-header">Undergraduate Courses</div>
      <ul>${d.undergraduate.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div>
    <div class="list-box">
      <div class="list-box-header">Graduate Courses</div>
      <ul>${d.graduate.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div>
  </div>
  <div class="clients-banner reveal" style="margin-top:1.5rem">
    <p style="color:rgba(255,255,255,.85);font-size:.9rem">📌 ${d.note}</p>
  </div>
</div>`;

revealOnScroll();
</script>
<div id="header" class="page-header"></div>
<main id="content"></main>
</body>
</html>
