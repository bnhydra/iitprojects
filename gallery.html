<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gallery | Flood Forecasting</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"/>
<link rel="stylesheet" href="css/style.css"/>
<style>
  .page-section{background:#111;color:#fff}
  .page-section .section-title{color:#fff}
</style>
</head>
<body>
<div id="nav-placeholder"></div>

<main class="page-section dark-section pt-5">
  <div class="container" id="content" style="padding-top:4rem;padding-bottom:4rem"></div>
</main>

<!-- Lightbox -->
<div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body position-relative">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        <img id="lightboxImg" src="" alt="Full size"/>
      </div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { NAV_HTML, FOOTER_HTML, initNav, lazyLoad, revealAll, img } from './js/shared.js';
document.getElementById('nav-placeholder').innerHTML = NAV_HTML;
document.getElementById('footer-placeholder').innerHTML = FOOTER_HTML;
initNav();

const d = await fetch('data/gallery.json').then(r => r.json());
const el = document.getElementById('content');
el.innerHTML = `
  <h2 class="section-title reveal">${d.title}</h2>
  <p class="reveal mb-4" style="color:rgba(255,255,255,.65)">${d.subtitle}</p>
  <div class="gallery-grid">
    ${d.items.map(i => `
    <div class="gallery-item reveal" title="${i.title}">
      ${img(i.src, i.title)}
      <div class="gallery-overlay">🔍</div>
    </div>`).join('')}
  </div>`;
lazyLoad(el);
revealAll(el);

const lbModal = document.getElementById('lightboxModal');
const lbImg = document.getElementById('lightboxImg');
el.querySelectorAll('.gallery-item').forEach(item => {
  item.addEventListener('click', () => {
    const i = item.querySelector('img');
    lbImg.src = i.src || i.dataset.src;
    new bootstrap.Modal(lbModal).show();
  });
});
</script>
</body>
</html>
