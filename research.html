<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Research | Prof. Balaji Narasimhan</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<script type="module">
import { initNav, revealOnScroll } from './js/shared.js';
initNav();
const d = await fetch('data/research.json').then(r=>r.json());

document.getElementById('header').innerHTML = `
<div class="container">
  <p class="breadcrumb"><a href="index.html">Home</a> › ${d.title}</p>
  <h1>${d.title}</h1>
  <p>${d.subtitle}</p>
</div>`;

document.getElementById('content').innerHTML = `
<div class="container section">
  <div class="cards">
    ${d.areas.map(a=>`
    <div class="card reveal">
      <div class="card-num">${a.num}</div>
      <h3>${a.title}</h3>
      <p>${a.desc}</p>
    </div>`).join('')}
  </div>
</div>`;

revealOnScroll();
</script>
<div id="header" class="page-header"></div>
<main id="content"></main>
</body>
</html>
