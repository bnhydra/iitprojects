<body>
<script type="module">
import { initNav, revealOnScroll, showLoader, hideLoader } from './js/shared.js';
initNav();
showLoader();
try {
const d = await fetch('data/research.json').then(r=>r.json());

document.getElementById('header').innerHTML = `
<div class="container">
  <p class="breadcrumb"><a href="index.html">Home</a> › ${d.title}</p>
  <h1>${d.title}</h1>
  <p>${d.subtitle}</p>
</div>`;

document.getElementById('content').innerHTML = `
<div class="container section">
  <div class="cards">
    ${d.areas.map(a=>{
      const descHtml = a.descLinks
        ? a.descLinks.map(l=>`<a class="card-desc-link" href="${l.url}" target="_blank" rel="noopener">${l.text}</a>`).join('')
        : `<p>${a.desc}</p>`;
      const inner = `<div class="card-num">${a.num}</div><h3>${a.title}</h3>${descHtml}`;
      return a.targetLink
        ? `<a class="card card-link reveal" href="${a.targetLink}" target="_blank" rel="noopener">${inner}</a>`
        : `<div class="card reveal">${inner}</div>`;
    }).join('')}
  </div>
</div>`;

revealOnScroll();
} catch(e) {
  document.getElementById('content').innerHTML = '<div class="container section" style="color:var(--muted)">Failed to load content. Please try again.</div>';
} finally {
  hideLoader();
}
</script>
