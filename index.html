<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Prof. Balaji Narasimhan | IIT Madras</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<script type="module">
import { initNav, revealOnScroll } from './js/shared.js';
initNav();

const d = await fetch('data/home.json').then(r=>r.json());
document.title = `${d.name} | IIT Madras`;

document.getElementById('hero').innerHTML = `
<div class="container">
  <div class="hero-inner">
    <img src="${d.photo}" alt="${d.name}" class="hero-photo" onerror="this.outerHTML='<div class=hero-photo-placeholder>👤</div>'"/>
    <div>
      <h1>${d.name}</h1>
      <p class="role">${d.role}</p>
      <p class="bio">${d.bio}</p>
      <div class="hero-btns">
        <a href="${d.ctaPrimary.href}" class="btn-primary">${d.ctaPrimary.label}</a>
        <a href="${d.ctaSecondary.href}" class="btn-outline">${d.ctaSecondary.label}</a>
      </div>
    </div>
  </div>
  <div class="highlights">
    ${d.highlights.map(h=>`
    <a href="research.html" class="hl-card">
      <div class="hl-icon">${h.icon}</div>
      <h4>${h.title}</h4>
      <p>${h.desc}</p>
    </a>`).join('')}
  </div>
</div>`;

const pages = [
  {href:'research.html',     icon:'🔬', label:'Research'},
  {href:'projects.html',     icon:'📋', label:'Sponsored Projects'},
  {href:'teaching.html',     icon:'🎓', label:'Academic Teaching'},
  {href:'outreach.html',     icon:'🌐', label:'Outreach'},
  {href:'consultancy.html',  icon:'🏗', label:'Consultancy'},
  {href:'people.html',       icon:'👥', label:'People'},
  {href:'publications.html', icon:'📄', label:'Publications'},
  {href:'achievements.html', icon:'🏆', label:'Achievements'},
  {href:'joinus.html',       icon:'✉️', label:'Join our Team'},
];
document.getElementById('nav-section').innerHTML = `
<div class="container section">
  <h2 class="section-title reveal">Explore</h2>
  <div class="nav-grid">
    ${pages.map(p=>`<a href="${p.href}" class="reveal"><div class="ng-icon">${p.icon}</div><span>${p.label}</span></a>`).join('')}
  </div>
</div>`;

revealOnScroll();
</script>

<section id="hero" class="hero"></section>
<div id="nav-section"></div>
</body>
</html>
