<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Prof. Balaji Narasimhan | IIT Madras</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
#iitm-header{background:#fff;border-bottom:1px solid #dce6ef;padding:.6rem 2rem;display:flex;align-items:center;gap:1.2rem}
#iitm-header img{height:64px;width:auto;flex-shrink:0}
#iitm-header .iitm-title h1{font-size:1rem;font-weight:700;color:#741812;margin:0 0 .15rem}
#iitm-header .iitm-title h3{font-size:.8rem;font-weight:600;color:#333;margin:0 0 .1rem}
#iitm-header .iitm-title h3 a,#iitm-header .iitm-title h4 a{color:#1a0dab;text-decoration:none}
#iitm-header .iitm-title h4{font-size:.75rem;font-weight:400;color:#555;margin:0}
@media(max-width:600px){#iitm-header{padding:.5rem 1rem}#iitm-header img{height:48px}#iitm-header .iitm-title h1{font-size:.85rem}}
</style>
</head>
<body>
<div id="iitm-header">
  <img src="images/Logo.png" alt="IIT Madras" onerror="this.style.display='none'"/>
  <div class="iitm-title">
    <h1>Hydraulics and Water Resources Engineering (HWRE) Group</h1>
    <h3><a href="http://civil.iitm.ac.in/" target="_blank" rel="noopener">Department of Civil Engineering</a></h3>
    <h4><a href="https://www.iitm.ac.in/" target="_blank" rel="noopener">Indian Institute of Technology Madras, Chennai-600036, Tamil Nadu, India</a></h4>
  </div>
</div>
<script type="module">
import { initNav, revealOnScroll, showLoader, hideLoader } from './js/shared.js';
initNav();
showLoader();
try {
const d = await fetch('data/home.json').then(r=>r.json());
document.title = `${d.name} | IIT Madras`;

document.getElementById('hero').innerHTML = `
<div class="container">
  <div class="hero-inner">
    <img src="${d.photo}" alt="${d.name}" class="hero-photo" onerror="this.outerHTML='<div class=hero-photo-placeholder>👤</div>'"/>
    <div>
      <h1>${d.name}</h1>
      <p class="role">${d.role}</p>
      <p class="bio">${d.bio}</p>
      <div class="hero-btns">
        <a href="${d.ctaPrimary.href}" class="btn-primary">${d.ctaPrimary.label}</a>
        <a href="${d.ctaSecondary.href}" class="btn-outline">${d.ctaSecondary.label}</a>
      </div>
    </div>
  </div>
  <div class="highlights">
    ${d.highlights.map(h=>`
    <a href="research.html" class="hl-card">
      <div class="hl-icon">${h.icon}</div>
      <h4>${h.title}</h4>
      <p>${h.desc}</p>
    </a>`).join('')}
  </div>
</div>`;

const pages = [
  {href:'research.html',     icon:'🔬', label:'Research'},
  {href:'projects.html',     icon:'📋', label:'Sponsored Projects'},
  {href:'teaching.html',     icon:'🎓', label:'Academic Teaching'},
  {href:'outreach.html',     icon:'🌐', label:'Outreach'},
  {href:'consultancy.html',  icon:'🏗', label:'Consultancy'},
  {href:'people.html',       icon:'👥', label:'People'},
  {href:'publications.html', icon:'📄', label:'Publications'},
  {href:'achievements.html', icon:'🏆', label:'Achievements'},
  {href:'joinus.html',       icon:'✉️', label:'Join our Team'},
];
document.getElementById('nav-section').innerHTML = `
<div class="container section">
  <h2 class="section-title reveal">Explore</h2>
  <div class="nav-grid">
    ${pages.map(p=>`<a href="${p.href}" class="reveal"><div class="ng-icon">${p.icon}</div><span>${p.label}</span></a>`).join('')}
  </div>
</div>`;

revealOnScroll();
} catch(e) {
  document.getElementById('hero').innerHTML = '<div class="container" style="padding:3rem 0;color:rgba(255,255,255,.6)">Failed to load content. Please try again.</div>';
} finally {
  hideLoader();
}
</script>

<section id="hero" class="hero"></section>
<div id="nav-section"></div>
</body>
</html>
