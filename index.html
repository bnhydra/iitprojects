<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flood Forecasting | IIT Madras</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="nav-placeholder"></div>

<main>
  <section id="hero">
    <div class="hero-overlay"></div>
    <div class="container hero-content py-5">
      <div class="row align-items-center min-vh-100">
        <div class="col-lg-8 col-md-10" id="hero-text"></div>
        <div class="col-lg-4 text-end d-none d-lg-block">
          <img id="hero-logo" src="" alt="IIT Madras Logo" class="hero-logo"/>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { NAV_HTML, FOOTER_HTML, initNav, lazyLoad, revealAll } from './js/shared.js';
document.getElementById('nav-placeholder').innerHTML = NAV_HTML;
document.getElementById('footer-placeholder').innerHTML = FOOTER_HTML;
initNav();

const d = await fetch('data/hero.json').then(r => r.json());
document.title = `${d.title} | IIT Madras`;
document.getElementById('hero').style.backgroundImage = `url('${d.bgImage}')`;
document.getElementById('hero-logo').src = d.logoImage;

const navCards = [
  {href:'background.html', icon:'🌊', label:'Background'},
  {href:'rtff.html',       icon:'📡', label:'RTFF & RTDAS'},
  {href:'rht.html',        icon:'🏙', label:'HydroTwin'},
  {href:'partners.html',   icon:'🤝', label:'Partners'},
  {href:'reservoir.html',  icon:'💧', label:'Reservoirs'},
  {href:'suds.html',       icon:'🌿', label:'SuDS'},
  {href:'climate.html',    icon:'🌡', label:'Climate'},
  {href:'gallery.html',    icon:'🖼', label:'Gallery'},
].map(c => `<a href="${c.href}" class="nav-card"><div class="nc-icon">${c.icon}</div><div class="nc-label">${c.label}</div></a>`).join('');

document.getElementById('hero-text').innerHTML = `
  <p class="hero-subtitle mb-2">${d.tagline}</p>
  <h1 class="hero-title mb-3">${d.title}</h1>
  <p class="hero-advisor">👤 <strong>Advisor:</strong> ${d.advisor}</p>
  <p class="hero-team">👥 ${d.team.join(' &bull; ')}</p>
  <div class="nav-cards">${navCards}</div>`;
</script>
</body>
</html>
