<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Prof. Balaji Narasimhan | IIT Madras – Hydrology & Water Resources</title>
<meta name="description" content="Prof. Balaji Narasimhan, Professor at IIT Madras Civil Engineering. Expert in hydrology, flood forecasting, GIS, remote sensing, and water resources engineering with 22+ years of experience."/>
<meta name="keywords" content="Balaji Narasimhan, IIT Madras, hydrology, flood forecasting, water resources engineering, GIS, remote sensing, SWAT, SuDS, climate change, Ganga River Basin"/>
<meta name="author" content="Prof. Balaji Narasimhan"/>
<meta name="robots" content="index, follow"/>
<link rel="canonical" id="meta-canonical"/>
<!-- Open Graph -->
<meta property="og:type" content="profile"/>
<meta property="og:title" content="Prof. Balaji Narasimhan | IIT Madras – Hydrology & Water Resources"/>
<meta property="og:description" content="Hydrologist with 22+ years of experience in flood forecasting, GIS, remote sensing, and water resources engineering at IIT Madras."/>
<meta property="og:url" id="meta-og-url"/>
<meta property="og:image" id="meta-og-image"/>
<meta property="og:site_name" content="HWRE Lab – IIT Madras"/>
<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="Prof. Balaji Narasimhan | IIT Madras"/>
<meta name="twitter:description" content="Hydrologist with 22+ years of experience in flood forecasting, GIS, remote sensing, and water resources engineering at IIT Madras."/>
<meta name="twitter:image" id="meta-tw-image"/>
<!-- Dynamic SEO: resolved at runtime so the site works on any domain/subfolder -->
<script>
(function(){
  const base = location.origin + location.pathname;
  const root = base.substring(0, base.lastIndexOf('/') + 1);
  document.getElementById('meta-canonical').href = base;
  document.getElementById('meta-og-url').content = base;
  // og:image and twitter:image are updated after JSON loads (see module script)
  window.__seoRoot = root;
})();
</script>
<!-- Structured Data: injected dynamically after JSON load (see module script) -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="dns-prefetch" href="https://scholar.google.co.in"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<script type="module">
import { initNav, revealOnScroll, showLoader, hideLoader } from './js/shared.js';
initNav();
showLoader();
try {
const d = await fetch('data/home.json').then(r=>r.json());
document.title = `${d.name} | IIT Madras`;

// Dynamic SEO: set image tags and inject JSON-LD using runtime URL
const _imgUrl = window.__seoRoot + d.photo;
document.getElementById('meta-og-image').content = _imgUrl;
document.getElementById('meta-tw-image').content = _imgUrl;
const _ld = document.createElement('script');
_ld.type = 'application/ld+json';
_ld.text = JSON.stringify({
  '@context':'https://schema.org','@type':'Person',
  name: d.name, jobTitle:'Professor',
  affiliation:{'@type':'CollegeOrUniversity','name':'Indian Institute of Technology Madras','url':'https://www.iitm.ac.in/'},
  url: location.origin + location.pathname,
  email: d.email,
  image: _imgUrl,
  sameAs:['https://scholar.google.co.in/citations?user=UHFAtUkAAAAJ','https://orcid.org/0000-0003-2609-9320','https://www.researchgate.net/scientific-contributions/Balaji-Narasimhan-2153141889'],
  knowsAbout:['Hydrology','Flood Forecasting','Water Resources Engineering','GIS','Remote Sensing','SWAT','SuDS']
});
document.head.appendChild(_ld);

document.getElementById('hero').innerHTML = `
<div class="container">
  <div class="hero-inner">
    <img src="${d.photo}" alt="${d.name}" class="hero-photo" onerror="this.outerHTML='<div class=hero-photo-placeholder>👤</div>'"/>
    <div>
      <h1>${d.name}</h1>
      <p class="role">${d.role}</p>
      <p class="bio">${d.bio}</p>
      <div class="hero-btns">
        <a href="${d.ctaPrimary.href}" class="btn-primary">${d.ctaPrimary.label}</a>
        <a href="${d.ctaSecondary.href}" class="btn-outline">${d.ctaSecondary.label}</a>
      </div>
    </div>
  </div>
  <div class="highlights">
    ${d.highlights.map(h=>`
    <a href="research.html" class="hl-card">
      <div class="hl-icon">${h.icon}</div>
      <h4>${h.title}</h4>
      <p>${h.desc}</p>
    </a>`).join('')}
  </div>
</div>`;

if (d.carousel?.length) {
  document.getElementById('carousel-wrap').innerHTML = `
<div id="carousel">
  <div class="carousel-track" id="carousel-track">
    ${d.carousel.map((s,i) => `
    <div class="carousel-slide${i===0?' active':''}">
      <img src="${s.image}" alt="Slide ${i+1}"/>
      ${s.targetLink ? `<a href="${s.targetLink}" target="_blank" class="carousel-readmore">Visit Site</a>` : ''}
    </div>`).join('')}
  </div>
  <button class="carousel-btn prev" onclick="carouselMove(-1)">&#8249;</button>
  <button class="carousel-btn next" onclick="carouselMove(1)">&#8250;</button>
  <div class="carousel-dots">
    ${d.carousel.map((_,i) => `<span class="dot${i===0?' active':''}" onclick="carouselGo(${i})"></span>`).join('')}
  </div>
</div>`;
  let cur = 0;
  const slides = () => document.querySelectorAll('.carousel-slide');
  const dots = () => document.querySelectorAll('.dot');
  window.carouselGo = (n) => {
    slides()[cur].classList.remove('active');
    dots()[cur].classList.remove('active');
    cur = (n + d.carousel.length) % d.carousel.length;
    slides()[cur].classList.add('active');
    dots()[cur].classList.add('active');
  };
  window.carouselMove = (dir) => carouselGo(cur + dir);
  setInterval(() => carouselMove(1), 5000);
}

const pages = [
  {href:'research.html',     icon:'🔬', label:'Research'},
  {href:'teaching.html',     icon:'🎓', label:'Teaching'},
  {href:'projects.html',     icon:'📋', label:'Sponsored Projects'},
  {href:'consultancy.html',  icon:'🏗', label:'Consultancy'},
    {href:'outreach.html',     icon:'🌐', label:'Outreach'},
  {href:'team.html',       icon:'👥', label:'Team'},
  {href:'publications.html', icon:'📄', label:'Publications'},
  {href:'achievements.html', icon:'🏆', label:'Achievements'},
  {href:'joinus.html',       icon:'✉️', label:'Join our Team'},
];
document.getElementById('nav-section').innerHTML = `
<div class="container section">
  <h2 class="section-title reveal">Explore</h2>
  <div class="nav-grid">
    ${pages.map(p=>`<a href="${p.href}" class="reveal"><div class="ng-icon">${p.icon}</div><span>${p.label}</span></a>`).join('')}
  </div>
</div>`;

revealOnScroll();
} catch(e) {
  document.getElementById('hero').innerHTML = '<div class="container" style="padding:3rem 0;color:rgba(255,255,255,.6)">Failed to load content. Please try again.</div>';
} finally {
  hideLoader();
}
</script>

<div id="carousel-wrap"></div>
<section id="hero" class="hero"></section>
<div id="nav-section"></div>
</body>
</html>
