<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reservoirs | Flood Forecasting</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"/>
<link rel="stylesheet" href="css/style.css"/>
<style>
  .page-section{background:#1a1a2e;color:#fff}
  .page-section .section-title{color:#fff}
</style>
</head>
<body>
<div id="nav-placeholder"></div>

<main class="page-section dark-section pt-5">
  <div class="container" id="content" style="padding-top:4rem;padding-bottom:4rem"></div>
</main>

<div id="footer-placeholder"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { NAV_HTML, FOOTER_HTML, initNav, lazyLoad, revealAll, img } from './js/shared.js';
document.getElementById('nav-placeholder').innerHTML = NAV_HTML;
document.getElementById('footer-placeholder').innerHTML = FOOTER_HTML;
initNav();

const d = await fetch('data/reservoir.json').then(r => r.json());
const el = document.getElementById('content');
el.innerHTML = `
  <h2 class="section-title reveal">${d.title}</h2>
  <p class="reveal mb-4" style="color:rgba(255,255,255,.75);max-width:700px">${d.intro}</p>
  <div class="row g-4 mb-3">
    ${d.cards.map(c => `
    <div class="col-md-6 reveal">
      <div class="reservoir-card">
        ${img(c.image, c.title)}
        <div class="rc-body">
          <div class="rc-title">${c.title}</div>
          <span class="rc-cap">${c.capacity}</span>
          <p class="rc-desc">${c.desc}</p>
        </div>
      </div>
    </div>`).join('')}
  </div>
  <div class="key-message-banner reveal">${d.keyMessage}</div>`;
lazyLoad(el);
revealAll(el);
</script>
</body>
</html>
